services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: bash -c "pip install -r requirements.txt && python -c 'import db; db.init_db()' && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API=http://localhost:8000
      - PORT=3000
    command: bash -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
